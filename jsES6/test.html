        function reverse(arr){
            // 初始length=0，随着i增加length也增加（自动更新并添加元素到尾部）
            var newarr=[];
            for(var i=arr.length-1;i>=0;i--){
                newarr[newarr.length]=arr[i];
            }
            return newarr;
        }
        var arr1=reverse([5,4,3,2,1]);
