        function unique(arr) {
            var newArr = [];
            for (var i = 0; i < arr.length; i++) {
                // newArr中找不到索引对应元素，就推送到新数组中
                if (newArr.indexOf(arr[i]) === -1) {
                    newArr.push(arr[i]);
                }
            }
            return newArr;
        }
