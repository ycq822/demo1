<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分时问候</title>
    <style>
        img{
            width: 274px;
            height: 274px;
        }
    </style>
</head>
<body>
    <img src="imgs/ai.jpg" alt title="上午好">
    <div>上午好，码农</div>
    <script>
        var img=document.querySelector('img');
        var div=document.querySelector('div');
        var date=new Date();
        var h=date.getHours();
        if(h<=12){
            img.src='imgs/ai.jpg';
            div.innerHTML='上午好，码农';
        }else if(h>12&&h<18){
            img.src='imgs/lufei.jpg';
            div.innerHTML='下午好，码农';
        }else{
            img.src='imgd/solo.jpg';
            div.innerHTML='晚上好，码农';
        }
    </script>
</body>
</html>
