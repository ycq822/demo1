<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关闭弹窗</title>
    <style>
        .box{
            position: relative;
            width: 80px;
            height: 90px;
            margin:100px auto;
            border: 1px solid pink;
            text-align: center;
            font-size: 8px;
            color: palevioletred;
        }
        img{
            width: 60px;
            height: 60px;
            padding-top: 8px;
            padding-left: 3px;
        }
        .close-btn{
            position: absolute;
            width: 10px;
            height: 10px;
            /* text-align: center; */
            top: -1px;
            left: -12px;
            /* 控制x位置 */
            line-height: 10px;
            border: 1px solid pink;

        }
    </style>
</head>
<body>
    <div class="box">
        我是美女
        <img src="imgs/ai.jpg" alt>
        <i class="close-btn">x</i>
    </div>
    <script>
        var btn=document.querySelector('.close-btn');
        // box=document.getElementsByClassName('box')没反应,因为返回的是伪数组，用时需要box[0]
        // query则返回第一个元素,且需要选择器符号
        var box=document.querySelector('.box');
        btn.onclick=function(){
            box.style.display='none';
        }
    </script>
</body>
</html>
