<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拖动弹窗框</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            list-style: none;
            text-decoration: none;
        }

        a {
            color: black;
        }

        .login-header {
            /* 层叠样式需配合position一起使用 */
            position: relative;
            z-index: 9999;
            width: 100%;
            height: 60px;
            font-size: 25px;
            line-height: 60px;
            text-align: center;
        }

        .login {
            display: none;
            width: 512px;
            height: 280px;
            border: 1px solid seagreen;
            /* 相对浏览器窗口定位，不随滚动移动 */
            position: fixed;
            /* 左上角在中心点 */
            left: 50%;
            top: 50%;
            /* 移动自身宽高的50%，实现元素的中心点与视口中心点重合 */
            transform: translate(-50%, -50%);
            /* x轴水平偏移,y垂直偏移，模糊半径，颜色 */
            box-shadow: 0 0 20px #ddd;
            z-index: 9999;
            background: white;
        }

        .login-title {
            width: 100%;
            text-align: center;
            height: 40px;
            line-height: 40px;
            font-size: 18px;
            position: relative;
            /* 可拖拽符号 */
            cursor: move;
        }

        .login-title span {
            position: absolute;
            right: -20px;
            top: -25px;
            background-color: beige;
            border: 1px solid antiquewhite;
            border-radius: 20px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            cursor: pointer;
            font-size: 18px;
            
        }

        .login-input-content {
            margin-top: 20px;
        }

        .login-input {
            overflow: hidden;
            margin: 0 0 20px;
        }

        .login-input label {
            float: left;
            width: 90px;
            text-align: right;
            padding-right: 10px;
            height: 35px;
            line-height: 35px;
            font-size: 16px;
        }

        .login-input input.list-input {
            float: left;
            width: 350px;
            height: 35px;
            line-height: 35px;
            border: 1px solid rgb(192, 168, 138);
            text-indent: 5px;

        }

        .login-input input.list-input:focus {
            /*focus伪类需要 正常状态下去除默认轮廓 */
            outline: none;
            border-color: #ad4848;
        }

        .login-button {
            width: 50%;
            height: 40px;
            line-height: 40px;
            text-align: center;
            border: 1px solid silver;
            margin: 30px auto 0;

        }

        /* 遮罩层样式  */
        .login-bg {
            display: none;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            background: rgb(72, 142, 212);
            z-index: 9998;
        }
    </style>
</head>

<body>
    <!-- 用id选择器原因：唯一后用querySelector
    #link - 页面中唯一的触发按钮
    #login - 唯一的登录弹窗容器
    #closeBtn - 唯一的关闭按钮
    #title - 唯一的拖拽标题栏
    #bg - 唯一的遮罩层 -->
    <div class="login-header"><a id="link" href="javascript:void(0);">点击弹出登录框</a></div>
    <div id="login" class="login">
        <div id="title" class="login-title">
            登录会员
            <span><a id="closeBtn" href="javascript:void(0);" class="close-login">关闭</a></span>
        </div>
        <div class="login-input-content">
            <div class="login-input">
                <label>用户名：</label>
                <input type="text" placeholder="请输入用户名" name="info[username]" id="username" class="list-input">
            </div>
            <div class="login-input">
                <label>登录密码：</label>
                <input type="password" placeholder="请输入登录密码" name="info[password]" id="password" class="list-input">
            </div>
            <div class="login-button" id="loginBtn">
                <a href="javascript:void(0);" id="login-button-submit">登录会员</a>
            </div>
        </div>
    </div>

    <!-- 遮罩层 -->
    <div id="bg" class="login-bg"></div>

    <script>
        var login = document.querySelector('.login');
        var mask = document.querySelector('.login-bg');
        var link = document.querySelector('#link');
        var closeBtn = document.querySelector('#closeBtn');
        var title = document.querySelector('#title');

        link.addEventListener('click', function () {
            mask.style.display = 'block';
            login.style.display = 'block';
        });
        closeBtn.addEventListener('click', function () {
            mask.style.display = 'none';
            login.style.display = 'none';
        });
            // 拖拽
            //鼠标按下获得鼠标在盒子内的坐标
        title.addEventListener('mousedown', function (e) {
            var x = e.pageX - login.offsetLeft;
            var y = e.pageY - login.offsetTop;
            //鼠标移动的时候，把鼠标在页面中的坐标，减去 鼠标在盒子内的坐标就是模态框的left和top值
            document.addEventListener('mousemove', move)

            function move(e) {
                login.style.left = e.pageX - x + 'px';
                login.style.top = e.pageY - y + 'px';
            }
            //鼠标弹起，就让鼠标移动事件移除
            document.addEventListener('mouseup', function () {
                document.removeEventListener('mousemove', move);
            })
        })
    </script>
</body>

</html>
