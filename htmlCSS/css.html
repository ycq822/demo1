<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css样式</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            border: none;
        }

        /* .bac {
            background: url(imgs/tuya.jpg) repeat;
            
        } */

        strong {
            font-size: 78px;
            letter-spacing: 20px;
            text-shadow: 10px 10px 10px gray;
        }

        .blue {
            color: blue;

        }

        .red {
            color: red;
        }

        .two {
            width: 80px;
            background-color: gray;
            border-bottom-style: dashed;
            border-color: aqua;
            border-style: dotted;
            border-width: 3px;
            border-color: greenyellow;
            text-decoration: underline;
        }

        .one {
            width: 80px;
            background-color: gray;
            border-bottom-style: dashed;
            border-color: aqua;
            font-size: 28px;
            text-align: center;
        }

        img {
            width: 300px;
            height: auto;
            
            /* padding: 26%; */
            border:solid;
            /* border-image-slice: 33%;
            border-image-width: 9px;
            border-image-repeat: repeat; */
        }

        .all {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .info p {
            width: 288px;
            height: 38px;
            border: 1px solid darkgrey;
            line-height: 33px;
            padding-left: 10px;
            margin-top: 2px;
        }
    </style>
</head>

<body>
    <!-- <div class="bac"> -->
        <strong class="blue">Y</strong><strong class="red">C</strong><strong class="blue">Q</strong>
        <p>一又七分之一是什么字？——答案：片</p>
        <div class="one">1</div>
        <div class="two">
            <p>2</p>
        </div>
        <div class="all">
            <div>
                <img src="imgs/logo.png" />
            </div>
            <div class="info">
                <p>用户姓名：</p>
                <p>学习进度：</p>
                <p>兴趣爱好：</p>
                <p>我的好友：</p>
            </div>
        </div>
    <!-- </div> -->

</body>

</html>
